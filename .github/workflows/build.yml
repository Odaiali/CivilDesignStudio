name: Build Civil Design Studio

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CivilDesignBeam/CivilDesignBeam.csproj

      - name: Publish EXE
        run: >
          dotnet publish CivilDesignBeam/CivilDesignBeam.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=false
          -o publish

      - name: Create ZIP package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path publish\* -DestinationPath artifacts\CivilDesignStudio-win-x64.zip -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CivilDesignStudio-win-x64
          path: artifacts/CivilDesignStudio-win-x64.zip
          if-no-files-found: error
